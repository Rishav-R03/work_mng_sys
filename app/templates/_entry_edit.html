{% from "_entry_form.html" import entry_fields %}
<div class="entry-item list-group-item bg-body-tertiary" id="entry-{{ entry.id }}">
  <form hx-post="/entries/{{ entry.id }}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML">
    <input type="hidden" name="month" value="{{ month }}">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    {{ entry_fields(entry, 'e' ~ entry.id, entry.date, projects) }}
    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" hx-get="/entries/list?month={{ month }}" hx-target="#entries-list" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
</div>
